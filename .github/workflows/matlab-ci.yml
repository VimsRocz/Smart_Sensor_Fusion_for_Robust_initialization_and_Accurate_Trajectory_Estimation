name: MATLAB CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3

      - name: Run canonical MATLAB tests
        uses: matlab-actions/run-tests@v3
        with:
          source-folder: MATLAB
          select-by-folder: MATLAB/tests
