name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          pip install -e ".[tests]"

      - name: Validate bundled inputs
        run: python PYTHON/run_pipeline.py --config config/pipeline_small.yaml --validate-only

      - name: Lint canonical Python code
        run: ruff check PYTHON/fusion_pipeline PYTHON/tests/pipeline PYTHON/run_pipeline.py gui.py

      - name: Run tests
        run: pytest -q

      - name: Smoke test all methods
        run: python PYTHON/run_pipeline.py --config config/pipeline_small.yaml --no-plots
