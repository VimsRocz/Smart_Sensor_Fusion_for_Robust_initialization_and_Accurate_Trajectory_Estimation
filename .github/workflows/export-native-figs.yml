name: Export native MATLAB FIG files

on:
  workflow_dispatch:
  push:
    branches:
      - agent/restructure-task-pipeline
    paths:
      - .github/workflows/export-native-figs.yml
      - MATLAB/export_python_figure.m
      - MATLAB/export_release_figures.m
      - PYTHON/fusion_pipeline/figure_export.py
      - PYTHON/fusion_pipeline/matlab_fig.py
      - PYTHON/src/utils/matlab_fig_export.py
      - PYTHON/src/requirements.txt
      - pyproject.toml

permissions:
  contents: read

jobs:
  export:
    name: ${{ matrix.imu }} + ${{ matrix.gnss }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - imu: x001
            gnss: x001
          - imu: x001
            gnss: x002
          - imu: x002
            gnss: x001
          - imu: x002
            gnss: x002
          - imu: x003
            gnss: x001
          - imu: x003
            gnss: x002

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release dependencies
        run: python -m pip install --disable-pip-version-check -e '.[release]'

      - name: Run all three released methods
        env:
          MPLBACKEND: Agg
        run: |
          for method in TRIAD Davenport SVD; do
            python PYTHON/run_release.py \
              --imu "${{ matrix.imu }}" \
              --gnss "${{ matrix.gnss }}" \
              --method "$method" \
              --truth DATA/Truth/STATE_X001.txt \
              --defer-fig \
              --output results

            # Keep same-stem plot MAT files until MATLAB reconstructs the
            # editable graphics objects; remove only non-figure intermediates.
            while IFS= read -r -d '' mat; do
              if [[ ! -f "${mat%.mat}.png" ]]; then
                rm -f -- "$mat"
              fi
            done < <(find results -type f -name '*.mat' -print0)
            find results -type f \( -name '*.npz' -o -name '*.pdf' \) -delete
          done

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3

      - name: Export and audit every native FIG with MATLAB
        uses: matlab-actions/run-command@v3
        with:
          command: |
            root = fullfile(pwd, "results");
            addpath(fullfile(pwd, "MATLAB"));
            export_release_figures(root);
            pngs = dir(fullfile(root, "**", "*.png"));
            figs = dir(fullfile(root, "**", "*.fig"));
            assert(~isempty(pngs), "No PNG plots were generated.");
            if numel(figs) ~= numel(pngs)
                error("release:FigCountMismatch", ...
                    "Expected one native FIG per PNG; found %d FIG and %d PNG.", ...
                    numel(figs), numel(pngs));
            end
            for k = 1:numel(figs)
                figPath = fullfile(figs(k).folder, figs(k).name);
                h = openfig(figPath, "invisible");
                metadata = h.UserData;
                assert(isstruct(metadata) && ...
                    isfield(metadata, "editable_plot_objects") && ...
                    metadata.editable_plot_objects, ...
                    "FIG is not data-editable: %s", figPath);
                close(h);
            end
            fprintf("Validated %d/%d native FIG files with MATLAB openfig.\n", ...
                numel(figs), numel(pngs));

      - name: Upload native MATLAB figures
        uses: actions/upload-artifact@v4
        with:
          name: native-fig-${{ matrix.imu }}-${{ matrix.gnss }}
          path: |
            results/**/*.fig
            results/**/*.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
