# Full X001 dataset: ~500,000 IMU samples at 400 Hz with reference trajectory.
# This is the configuration behind the headline accuracy numbers in the README.

input:
  imu: DATA/IMU/IMU_X001.dat
  gnss: DATA/GNSS/GNSS_X001.csv
  truth: DATA/Truth/STATE_X001.txt

run:
  method: ALL          # TRIAD | Davenport | SVD | a comma-separated subset | ALL
  tasks: 1-7
  output: results
  run_id: X001_full

pipeline:
  imu_measurement_type: delta
  truth_quaternion_order: xyzw
  truth_quaternion_frame: body_to_ecef
  truth_attitude_time_offset_s: -0.05

  static_samples: 400
  gravity_weight: 0.9999
  earth_rate_weight: 0.0001
  process_accel_std_mps2: 20.0
  gnss_position_std_m: 2.0
  gnss_velocity_std_mps: 0.5
  max_specific_force_mps2: 100.0
  max_angular_rate_rps: 20.0

  max_plot_points: 50000
  plot_dpi: 160
  plots: true
