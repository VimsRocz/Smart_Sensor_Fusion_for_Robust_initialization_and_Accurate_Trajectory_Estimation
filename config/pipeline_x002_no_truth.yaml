# X002 has no reference trajectory in DATA/Truth, so this configuration shows
# the truth-optional path: Tasks 1-5 run normally, Task 6 records status
# "skipped", and Task 7 falls back to GNSS innovation statistics.

input:
  imu: DATA/IMU/IMU_X002.dat
  gnss: DATA/GNSS/GNSS_X002.csv
  # truth: intentionally absent

run:
  method: ALL
  tasks: 1-7
  output: results
  run_id: X002_full_no_truth

pipeline:
  imu_measurement_type: delta
  static_samples: 400
  gravity_weight: 0.9999
  earth_rate_weight: 0.0001
  process_accel_std_mps2: 20.0
  gnss_position_std_m: 2.0
  gnss_velocity_std_mps: 0.5
  max_specific_force_mps2: 100.0
  max_angular_rate_rps: 20.0
  max_plot_points: 50000
  plots: true
