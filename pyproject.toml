[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imu_gnss_fusion"
version = "2.0.0"
description = "Contract-driven Task 1-7 GNSS/IMU fusion with TRIAD, Davenport and SVD"
authors = [{ name = "VimsRocz" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "matplotlib>=3.8",
  "pyyaml>=6",
]

[project.scripts]
sensor-fusion = "fusion_pipeline.cli:main"

[project.optional-dependencies]
# Development checks layered on top of the main runtime dependencies.
tests = [
    "pytest>=8",
    "ruff>=0.9",
]

legacy = [
  "scipy",
  "pandas",
  "tqdm",
  "tabulate",
  "rich",
  "filterpy",
  "cartopy",
  "geomaglib>=1.2.1",
  "pyproj",
  "fastdtw",
  "plotly>=5",
  "kaleido",
  "geopy",
]

[tool.setuptools]
package-dir = {"" = "PYTHON"}

[tool.setuptools.packages.find]
where = ["PYTHON"]
include = ["fusion_pipeline*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["PYTHON/tests/pipeline"]
pythonpath = ["PYTHON"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["PYTHON/fusion_pipeline", "PYTHON/tests/pipeline"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402", "E501"]
